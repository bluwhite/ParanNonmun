<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>파란 논문</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="wrap">
  <header class="hero">
    <div>
      <div class="eyebrow">Local-first Research Paper Manager</div>
      <h1>파란 논문</h1>
      <p>논문 목록과 로컬 PDF를 한 폴더에서 관리합니다.</p>
    </div>
    <span id="versionBadge" class="version"></span>
  </header>

  <section class="card">
    <div class="section-head">
      <div>
        <h2>논문 폴더</h2>
        <div id="dataFileStatus" class="subtle">데이터 파일: 연결 전</div>
      </div>
      <div class="buttons">
        <button id="chooseBtn" class="primary">논문 폴더 선택</button>
        <button id="reopenBtn">이전 폴더 다시 열기</button>
        <button id="scanBtn" disabled>폴더 다시 읽기</button>
      </div>
    </div>
    <div id="status" class="statusbox">아직 폴더를 선택하지 않았습니다.</div>
  </section>

  <section class="card paper-list-card">
    <div class="section-head">
      <div>
        <h2>논문 목록</h2>
        <div id="paperCount">논문 0편</div>
      </div>
      <div class="paper-actions">
        <input id="paperSearchBox" type="search" placeholder="목록 검색">
        <button id="addPaperBtn" class="primary" disabled>논문 추가</button>
      </div>
    </div>
    <div class="save-line">
      <span id="saveState" class="save-state">폴더를 선택하세요.</span>
    </div>
    <div class="paper-table-wrap">
      <table class="paper-table">
        <thead>
          <tr>
            <th>확인(*)</th>
            <th>저자</th>
            <th>출판연도</th>
            <th>논문명</th>
            <th>학술지명</th>
            <th>권</th>
            <th>호</th>
            <th>학회명</th>
            <th>시작페이지</th>
            <th>끝페이지</th>
            <th>메모</th>
            <th>PDF</th>
          </tr>
        </thead>
        <tbody id="paperBody">
          <tr><td colspan="12" class="empty">논문 폴더를 선택하세요.</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <div class="section-head">
      <div><h2>PDF 메모 검색</h2><div id="noteResultCount">검색 전</div></div>
      <div class="note-search-controls">
        <input id="noteQuery" type="search" placeholder="메모 내용 검색 · 비우면 전체">
        <button id="noteSearchBtn" class="primary" disabled>메모 검색</button>
      </div>
    </div>
    <div id="noteSearchStatus" class="search-progress">현재 연결된 폴더의 PDF 표준 메모(Text/FreeText)를 검색합니다.</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>파일 이름</th><th>페이지</th><th>메모 내용</th></tr></thead>
        <tbody id="noteBody"><tr><td colspan="3" class="empty">메모 검색을 누르면 결과가 표시됩니다.</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="./shared.js"></script>
<script src="./paper-data/data-store.js"></script>
<script src="./pdf-search/note-search.js"></script>
<script src="./main.js"></script>
</body>
</html>
