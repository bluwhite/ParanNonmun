<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>파란 논문</title>
<link rel="stylesheet" href="https://unpkg.com/@univerjs/preset-sheets-core@0.15.4/lib/index.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="wrap">
  <header class="hero compact-hero">
    <div class="brand-line">
      <div class="brand-title">
        <div class="eyebrow">Local-first Research Paper Manager</div>
        <h1>파란 논문</h1>
      </div>
      <span id="folderInfo" class="folder-info">현재 폴더: 선택되지 않음</span>
      <button id="chooseBtn" class="primary folder-select-btn">논문 폴더 선택</button>
    </div>
    <span id="versionBadge" class="version"></span>
  </header>

  <section class="card paper-list-card">
    <div class="section-head">
      <div>
        <h2>논문 목록</h2>
        <div id="paperCount">논문 0편</div>
      </div>
      <div class="paper-actions">
        <input id="paperSearchBox" type="search" placeholder="시트에서 찾기">
        <button id="paperFindBtn" disabled>찾기</button>
        <button id="addPaperBtn" class="primary" disabled>논문 추가</button>
      </div>
    </div>
    <div class="save-line">
      <span class="column-hint">스프레드시트처럼 셀 편집·복사/붙여넣기·행/열 조작·크기 조절이 가능합니다. 기본 열 이름은 유지됩니다.</span>
      <span id="saveState" class="save-state">폴더를 선택하세요.</span>
    </div>
    <div id="paperSheet" class="paper-sheet-host">
      <div class="sheet-placeholder">논문 폴더를 선택하면 스프레드시트가 열립니다.</div>
    </div>
  </section>

  <section class="card">
    <div class="section-head">
      <div><h2>PDF 메모 검색</h2><div id="noteResultCount">검색 전</div></div>
      <div class="note-search-controls">
        <input id="noteQuery" type="search" placeholder="메모 내용 검색 · 비우면 전체">
        <button id="noteSearchBtn" class="primary" disabled>메모 검색</button>
      </div>
    </div>
    <div id="noteSearchStatus" class="search-progress">현재 연결된 폴더의 PDF 표준 메모(Text/FreeText)를 검색합니다.</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>파일 이름</th><th>페이지</th><th>메모 내용</th></tr></thead>
        <tbody id="noteBody"><tr><td colspan="3" class="empty">메모 검색을 누르면 결과가 표시됩니다.</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/rxjs@7.8.2/dist/bundles/rxjs.umd.min.js"></script>
<script src="https://unpkg.com/echarts@5.6.0/dist/echarts.min.js"></script>
<script src="https://unpkg.com/@univerjs/presets@0.15.4/lib/umd/index.js"></script>
<script src="https://unpkg.com/@univerjs/preset-sheets-core@0.15.4/lib/umd/index.js"></script>
<script src="https://unpkg.com/@univerjs/preset-sheets-core@0.15.4/lib/umd/locales/en-US.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="./shared.js"></script>
<script src="./paper-data/data-store.js"></script>
<script src="./paper-sheet/univer-sheet.js"></script>
<script src="./pdf-search/note-search.js"></script>
<script src="./main.js"></script>
</body>
</html>
