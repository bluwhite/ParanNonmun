<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>논문 PDF 관리</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="wrap">
  <header class="hero"><div><div class="eyebrow">GitHub Pages · Chrome / Edge</div><h1>논문 PDF 관리</h1><p>로컬 폴더의 PDF를 관리합니다.</p></div><span id="versionBadge" class="version"></span></header>
  <section class="card"><h2>논문 폴더</h2><div class="buttons"><button id="chooseBtn" class="primary">논문 폴더 선택</button><button id="reopenBtn">이전 폴더 다시 열기</button><button id="scanBtn" disabled>PDF 다시 검색</button></div><div id="status" class="statusbox">아직 폴더를 선택하지 않았습니다.</div></section>
  <section class="card"><div class="section-head"><div><h2>PDF 목록</h2><div id="countText">PDF 0개</div></div><input id="searchBox" type="search" placeholder="파일명 또는 상대경로 검색"></div><div class="table-wrap"><table><thead><tr><th>파일명</th><th>상대경로</th><th>크기</th><th></th></tr></thead><tbody id="pdfBody"><tr><td colspan="4" class="empty">논문 폴더를 선택하세요.</td></tr></tbody></table></div></section>
  <section class="card">
    <div class="section-head">
      <div><h2>PDF 메모 검색</h2><div id="noteResultCount">검색 전</div></div>
      <div class="note-search-controls">
        <input id="noteQuery" type="search" placeholder="메모 내용 검색 · 비우면 전체">
        <button id="noteSearchBtn" class="primary" disabled>메모 검색</button>
      </div>
    </div>
    <div id="noteSearchStatus" class="search-progress">현재 연결된 폴더의 PDF 표준 메모(Text/FreeText)를 검색합니다.</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>파일 이름</th><th>페이지</th><th>메모 내용</th></tr></thead>
        <tbody id="noteBody"><tr><td colspan="3" class="empty">메모 검색을 누르면 결과가 표시됩니다.</td></tr></tbody>
      </table>
    </div>
  </section>
</main>
<script src="./shared.js"></script>
<script src="./main.js"></script>
</body></html>
