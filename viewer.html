<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDF 편집</title>
  <link rel="stylesheet" href="./viewer.css">
</head>
<body>
  <header class="topbar">
    <div class="file-block">
      <button id="closeBtn" class="ghost">← 목록</button>
      <div>
        <div id="fileName" class="filename">PDF 불러오는 중...</div>
        <div id="filePath" class="filepath"></div>
      </div>
    </div>

    <div class="toolbar">
      <button id="highlightBtn" class="tool active">형광펜</button>
      <button id="noteBtn" class="tool">메모</button>
      <input id="noteText" type="text" placeholder="메모 내용">
      <button id="undoBtn">실행 취소</button>
      <button id="saveCopyBtn">복사본 저장</button>
      <button id="saveBtn" class="save">원본에 저장</button>
    </div>
  </header>

  <div class="subbar">
    <div class="page-controls">
      <button id="prevBtn">◀</button>
      <span><b id="pageNo">1</b> / <span id="pageTotal">1</span></span>
      <button id="nextBtn">▶</button>
      <button id="zoomOutBtn">−</button>
      <span id="zoomText">125%</span>
      <button id="zoomInBtn">＋</button>
    </div>
    <div id="status" class="status">준비 중...</div>
  </div>

  <main class="viewer-area">
    <div id="pageShell" class="page-shell">
      <canvas id="pdfCanvas"></canvas>
      <canvas id="overlayCanvas"></canvas>
    </div>
  </main>

  <div id="dirtyBadge" class="dirty hidden">저장되지 않은 변경 사항</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="./shared.js"></script>
  <script src="./viewer.js"></script>
</body>
</html>
