<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDF 편집</title>
  <link rel="stylesheet" href="./viewer.css">
</head>
<body>
<header class="topbar">
  <div class="file-block">
    <button id="closeBtn">← 목록</button>
    <div class="file-text">
      <div id="fileName" class="filename">PDF 불러오는 중...</div>
      <div id="filePath" class="filepath"></div>
    </div>
  </div>

  <div class="toolbar">
    <button id="highlightBtn" class="tool active">형광펜</button>
    <button id="noteBtn" class="tool">메모</button>
    <input id="noteText" type="text" placeholder="메모 내용">
    <button id="undoBtn">실행 취소</button>
    <button id="zoomOutBtn">−</button>
    <span id="zoomText">125%</span>
    <button id="zoomInBtn">＋</button>
    <button id="saveCopyBtn">복사본 저장</button>
    <button id="saveBtn" class="save">원본에 저장</button>
  </div>
</header>

<div class="subbar">
  <span id="status">준비 중...</span>
  <span id="pageIndicator">페이지 - / -</span>
</div>

<main id="scrollArea" class="scroll-area">
  <div id="pages" class="pages"></div>
</main>

<div id="dirtyBadge" class="dirty hidden">저장되지 않은 변경 사항</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="./shared.js"></script>
<script src="./viewer.js"></script>
</body>
</html>
