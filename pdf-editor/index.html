<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파란 논문 · PDF 편집기</title><link rel="stylesheet" href="./editor.css"></head>
<body>
<header class="topbar">
  <div class="file-block"><button id="closeBtn">← 목록</button><div class="file-text"><div id="fileName" class="filename">PDF 불러오는 중...</div><div id="filePath" class="filepath"></div></div><span id="versionBadge" class="version"></span><span id="modeLabel" class="mode-label read">읽기 모드</span></div>
  <div class="toolbar">
    <button id="editBtn" class="primary">편집 시작</button>
    <div id="editTools" class="edit-tools hidden"><button id="highlightBtn" class="tool active">형광펜</button><button id="noteBtn" class="tool">메모</button><input id="noteText" type="text" placeholder="메모 내용"><button id="undoBtn">실행 취소</button><button id="cancelEditBtn">편집 취소</button><button id="saveBtn" class="save">저장</button></div>
    <button id="zoomOutBtn">−</button><span id="zoomText">125%</span><button id="zoomInBtn">＋</button>
  </div>
</header>
<div class="subbar"><span id="viewerStatus">읽기 모드 · 아래로 스크롤해서 문서를 읽으세요.</span><span id="pageIndicator">페이지 - / -</span></div>
<main id="scrollArea" class="scroll-area"><div id="pages" class="pages"></div></main><div id="dirtyBadge" class="dirty hidden">저장되지 않은 변경 사항</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="../shared.js"></script><script src="./editor.js"></script>
</body></html>
