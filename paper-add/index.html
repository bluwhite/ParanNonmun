<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>파란 논문 · 논문 추가</title>
<link rel="stylesheet" href="./add.css">
</head>
<body>
<main class="add-wrap">
  <header class="add-head">
    <div>
      <div class="eyebrow">REFERENCE IMPORT</div>
      <h1>논문 추가</h1>
      <p>참고문헌 정보를 붙여 넣고 Groq AI가 형식을 판단하게 하거나, RIS·APA·MLA를 직접 선택하세요.</p>
    </div>
    <span id="versionBadge" class="version"></span>
  </header>

  <section class="panel">
    <label class="label" for="risText">참고문헌 정보</label>
    <textarea id="risText" autofocus placeholder="RIS, APA 또는 MLA 참고문헌 정보를 붙여 넣으세요."></textarea>

    <div class="import-actions">
      <button id="brCleanupBtn" type="button">BR 줄바꿈 정리</button>
      <span class="action-spacer"></span>
      <button id="aiParseBtn" type="button" class="ai-parse-button">AI 분석</button>
      <button id="risParseBtn" type="button">RIS</button>
      <button id="mlaParseBtn" type="button">MLA</button>
      <button id="apaParseBtn" type="button" class="primary">APA</button>
    </div>

    <div class="hint">
      <strong>AI 분석</strong>은 Qwen 3.6 27B가 참고문헌 형식을 스스로 판단하여 정보를 추출합니다.
      RIS·APA·MLA 버튼은 기존 규칙 기반 분석을 그대로 사용합니다.
      학술지명은 <code>reference-data/journal-info.json</code>에서 학회명을 보완하고,
      여러 저자는 <strong>·</strong>로 구분합니다.
    </div>
  </section>

  <section class="panel">
    <div class="preview-head">
      <h2>추가될 정보</h2>
      <span id="parseState">입력 대기 중</span>
    </div>
    <details id="aiDiagnosticBox" class="ai-diagnostic-box" hidden>
      <summary>AI 오류 상세 보기</summary>
      <pre id="aiDiagnosticText"></pre>
      <button id="copyAiDiagnosticBtn" type="button">오류 상세 복사</button>
    </details>
    <div id="previewGrid" class="preview-grid"></div>
  </section>

  <div class="footer-actions">
    <button id="cancelBtn">취소</button>
    <button id="addBtn" class="primary" disabled>목록에 추가</button>
  </div>
</main>

<script src="../shared.js"></script>
<script src="../ai-config/credential-store.js"></script>
<script src="../paper-data/data-store.js"></script>
<script src="../reference-import/author-utils.js"></script>
<script src="../reference-import/ris-parser.js"></script>
<script src="../reference-import/apa-parser.js"></script>
<script src="../reference-import/mla-parser.js"></script>
<script src="../reference-import/ai-parser.js"></script>
<script src="./add.js"></script>
</body>
</html>
